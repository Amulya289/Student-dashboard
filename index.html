<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

.container {
    max-width: 400px;
    margin: auto;
    padding: 15px;
}

/* Profile Section */
.profile {
    background: linear-gradient(135deg, #4a90e2, #6fc3ff);
    color: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.profile img {
    width: 70px;
    border-radius: 50%;
    margin-bottom: 10px;
}

.profile h2 {
    margin: 5px 0;
}

.profile p {
    margin: 0;
    font-size: 14px;
}

/* Quick Actions */
.actions {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
}

.action-btn {
    flex: 1;
    margin: 5px;
    background: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    font-size: 14px;
    cursor: pointer;
}

/* Section Titles */
.section-title {
    font-weight: bold;
    margin: 10px 0 5px;
}

/* Cards */
.card {
    background: white;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    font-size: 14px;
}

/* Notifications Highlight */
.notification {
    border-left: 4px solid #4a90e2;
}
</style>
</head>

<body>

<div class="container">

    <!-- Profile -->
    <div class="profile">
        <img src="https://via.placeholder.com/70" alt="profile">
        <h2>Amulya</h2>
        <p>Computer Science Student</p>
    </div>

    <!-- Quick Actions -->
    <div class="actions">
        <div class="action-btn">📚 Courses</div>
        <div class="action-btn">📝 Assignments</div>
        <div class="action-btn">📊 Grades</div>
    </div>

    <!-- Recent Activity -->
    <div class="section-title">Recent Activity</div>
    <div class="card">Submitted AI Assignment</div>
    <div class="card">Attended Quantum Lecture</div>
    <div class="card">Scored 85% in Test</div>

    <!-- Notifications -->
    <div class="section-title">Notifications</div>
    <div class="card notification">New assignment due tomorrow</div>
    <div class="card notification">Exam schedule released</div>

</div>

</body>
</html>
